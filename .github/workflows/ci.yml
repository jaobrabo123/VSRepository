name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Diferente da v1, a v2 é ORM-agnostic: o core (`VSRepository`) nunca fala
    # com um banco diretamente, então os testes rodam contra um `VSRepoAdapter`
    # falso (ver test/helpers/fake-adapter.ts) — não precisamos de um serviço
    # Postgres nem de `prisma migrate deploy` aqui.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (typing + implementation)
        run: pnpm test
