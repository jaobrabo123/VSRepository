name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vsrepo
          POSTGRES_PASSWORD: vsrepo
          POSTGRES_DB: vsrepo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsrepo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vsrepo:vsrepo@localhost:5432/vsrepo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Build (needed so generated/vsrepo self-resolves against dist/)
        run: pnpm run build

      - name: Regenerate generated/vsrepo from the freshly built dist/
        run: pnpm run vsrepo

      - name: Run tests (typing + implementation)
        run: pnpm test
